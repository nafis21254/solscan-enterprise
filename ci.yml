# ============================================================================
# SolScan Enterprise — CI/CD Pipeline
# ============================================================================
# Triggers on every PR and push to main. Runs:
#   1. Lint (ruff + mypy)
#   2. Unit tests (pytest with coverage)
#   3. Security scan (bandit on our own codebase)
#   4. SolScan self-test (run the tool on test fixtures)
#   5. Upload SARIF results to GitHub Security tab
# ============================================================================

name: SolScan CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write  # Required for SARIF upload

jobs:
  # ------------------------------------------------------------------
  # Job 1: Lint & Type Check
  # ------------------------------------------------------------------
  lint:
    name: "Lint & Type Check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Ruff (lint + format check)
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: MyPy (type check)
        run: mypy src/ --ignore-missing-imports

  # ------------------------------------------------------------------
  # Job 2: Unit Tests
  # ------------------------------------------------------------------
  test:
    name: "Tests (Python ${{ matrix.python-version }})"
    runs-on: ubuntu-latest
    needs: lint

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run unit tests with coverage
        run: |
          pytest tests/unit/ \
            --cov=src \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            -v

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

  # ------------------------------------------------------------------
  # Job 3: Security — scan our own Python code with Bandit
  # ------------------------------------------------------------------
  security:
    name: "Security (Bandit)"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r src/ -f json -o bandit-results.json || true

      - name: Upload Bandit results
        uses: actions/upload-artifact@v4
        with:
          name: bandit-results
          path: bandit-results.json

  # ------------------------------------------------------------------
  # Job 4: Integration — Run SolScan on test fixtures
  # ------------------------------------------------------------------
  solscan-integration:
    name: "SolScan Integration Test"
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install solc 0.7.6 via solc-select
        run: |
          solc-select install 0.7.6
          solc-select use 0.7.6

      - name: Run SolScan on vulnerable fixture
        run: |
          python -m src.main scan tests/fixtures/VulnerableVault.sol \
            --output solscan-results.sarif \
            || true  # Don't fail CI — we expect findings

      - name: Validate SARIF output exists
        run: |
          test -f solscan-results.sarif
          python -c "
          import json, sys
          with open('solscan-results.sarif') as f:
              sarif = json.load(f)
          assert sarif['version'] == '2.1.0', 'Invalid SARIF version'
          print(f'✓ SARIF valid: {len(sarif[\"runs\"][0][\"results\"])} findings')
          "

      # Upload SARIF to GitHub Security tab
      - name: Upload SARIF to GitHub Code Scanning
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: solscan-results.sarif
          category: solscan-enterprise

      - name: Upload SARIF as artifact
        uses: actions/upload-artifact@v4
        with:
          name: solscan-sarif-results
          path: solscan-results.sarif
